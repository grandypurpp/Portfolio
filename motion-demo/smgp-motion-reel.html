<title>SMGP Motion Reel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;800&display=swap">
<style>
/* Layout: an edit bay. 9:16 program monitor on the left, transport and tuning rack on the right; stacks on phones. */
:root{
  color-scheme:dark;
  --bg:#090b10; --panel:#10131a; --line:#212633; --fg:#e8ecf4; --muted:#8a92a6; --accent:#4f8cff;
  --sans:Inter,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.wrap.render{max-width:none;padding:0;gap:0}
.wrap.render header,.wrap.render .rack{display:none}
.wrap.render .bay{display:block}
.wrap.render canvas#stage{width:1080px;height:1920px;max-width:none;border:0;border-radius:0}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-size:20px;font-weight:700;letter-spacing:-0.01em;margin:0}
header p{margin:0;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.bay{display:grid;grid-template-columns:minmax(0,auto) minmax(0,380px);gap:22px;align-items:start;justify-content:center}
.monitor{min-width:0;display:flex;justify-content:center}
canvas#stage{display:block;width:min(100%,calc((100vh - 130px)*9/16));min-width:min(100%,250px);max-width:100%;aspect-ratio:9/16;height:auto;border-radius:14px;border:1px solid var(--line);background:#06080d;cursor:pointer}
.rack{min-width:0;display:flex;flex-direction:column;gap:16px}
.group{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.group h2{margin:0;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.transport{display:flex;align-items:center;gap:12px}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play{background:var(--accent);border-color:var(--accent);color:#04060a;font-weight:700;min-width:84px}
#time{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12.5px;padding:5px 9px;color:var(--muted)}
.chips button.on{color:var(--fg);border-color:var(--accent)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.row label{font-size:13.5px}
.row output{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px}
.check input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.ease{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center}
#curve{width:96px;height:96px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.ease code{font-family:var(--mono);font-size:12px;color:var(--fg);display:block;overflow-wrap:anywhere}
.ease small{color:var(--muted);font-size:12px;display:block;margin-top:4px}
input[type=color]{width:44px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:transparent}
.note{color:var(--muted);font-size:12.5px;margin:0}
@media (max-width:760px){.bay{grid-template-columns:minmax(0,1fr)}canvas#stage{width:min(100%,340px)}}
</style>

<div class="wrap" id="wrap">
  <header>
    <h1>SMGP Motion Reel</h1>
    <p>9:16 · 36 s · 120 BPM · sample copy and data</p>
  </header>
  <div class="bay">
    <div class="monitor"><canvas id="stage" width="720" height="1280" aria-label="Motion graphics preview"></canvas></div>
    <div class="rack">
      <div class="group">
        <h2>Transport</h2>
        <div class="transport">
          <button id="play" type="button">Play</button>
          <button id="restart" type="button">Restart</button>
          <span id="time">00.00 / 36.00</span>
        </div>
        <input id="scrub" type="range" min="0" max="36" step="0.01" value="2.9" aria-label="Timeline position">
        <div class="chips" id="chips"></div>
      </div>
      <div class="group">
        <h2>Motion curve</h2>
        <div class="ease">
          <canvas id="curve" width="192" height="192" aria-hidden="true"></canvas>
          <div><code id="bez">cubic-bezier(0.33, 0, 0.67, 1)</code><small id="bezNote">After Effects Easy Ease default</small></div>
        </div>
        <div class="row"><label for="infl">Ease influence</label><output id="inflOut">33%</output>
          <input id="infl" type="range" min="10" max="90" step="1" value="33"></div>
        <label class="check"><input id="blur" type="checkbox" checked> Motion blur on transitions (180° shutter)</label>
      </div>
      <div class="group">
        <h2>Look</h2>
        <div class="row"><label for="accent">Accent color</label><input id="accent" type="color" value="#4f8cff"></div>
        <div class="row"><label for="zoom">Macro zoom</label><output id="zoomOut">2.4×</output>
          <input id="zoom" type="range" min="1.6" max="3.4" step="0.1" value="2.4"></div>
        <div class="row"><label for="vig">Vignette and edge blur</label><output id="vigOut">70%</output>
          <input id="vig" type="range" min="0" max="100" step="1" value="70"></div>
      </div>
      <div class="group">
        <h2>Sound</h2>
        <div class="row"><label for="sfx">Sound effects</label><output id="sfxOut">90%</output>
          <input id="sfx" type="range" min="0" max="100" step="1" value="90"></div>
        <div class="row"><label for="bed">Beat bed</label><output id="bedOut">60%</output>
          <input id="bed" type="range" min="0" max="100" step="1" value="60"></div>
        <p class="note">Every hit lands on the 120 BPM grid. Sound starts when you press Play.</p>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 1080, H = 1920, DUR = 36, TD = 0.4;
const RENDER = /[?&]render=1/.test(location.search);
const S = RENDER ? 1 : 2 / 3;
const SANS = 'Inter, "Helvetica Neue", Arial, sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
const P = { accent: '#4f8cff', infl: 1 / 3, zoom: 2.4, vig: 0.7, blur: true, sfx: 0.9, bed: 0.6 };
let AR = [79, 140, 255];

const stage = document.getElementById('stage');
if (RENDER) document.getElementById('wrap').classList.add('render');
stage.width = Math.round(W * S); stage.height = Math.round(H * S);
const m = stage.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = stage.width; c.height = stage.height; return { cv: c, c: c.getContext('2d') }; };
const L0 = mk(), L1 = mk(), ACC = mk(), TMP = mk();
const fx = { vig: 0.35, dof: 0 };

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
function bezY(x1, y1, x2, y2, x) {
  if (x <= 0) return 0; if (x >= 1) return 1;
  let lo = 0, hi = 1, u = x;
  for (let i = 0; i < 22; i++) { u = (lo + hi) / 2; const v = 1 - u; const bx = 3 * u * v * v * x1 + 3 * u * u * v * x2 + u * u * u; if (bx < x) lo = u; else hi = u; }
  const v = 1 - u; return 3 * u * v * v * y1 + 3 * u * u * v * y2 + u * u * u;
}
// After Effects Easy Ease: zero speed at both keyframes, equal influence on each side.
const ee = p => bezY(P.infl, 0, 1 - P.infl, 1, p);
const tw = (t, a, b) => ee(clamp((t - a) / (b - a)));
const bell = x => { x = clamp(x, -1, 1); return Math.pow(Math.cos(x * Math.PI / 2), 2); };
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

/* ---------- draw helpers ---------- */
const ac = (a = 1) => `rgba(${AR[0]},${AR[1]},${AR[2]},${a})`;
const wh = (a = 1) => `rgba(236,241,250,${a})`;
function T(c, s, x, y, size, wt, col, o = {}) {
  c.font = `${wt} ${size}px ${o.mono ? MONO : SANS}`; c.fillStyle = col;
  c.textAlign = o.align || 'left'; c.textBaseline = 'alphabetic';
  c.letterSpacing = (o.ls || 0) + 'px'; c.fillText(s, x, y); c.letterSpacing = '0px';
}
function card(c, x, y, w, h, r = 36) {
  c.save(); c.shadowColor = 'rgba(0,0,0,0.6)'; c.shadowBlur = 70 * S; c.shadowOffsetY = 26 * S;
  c.beginPath(); c.roundRect(x, y, w, h, r); c.fillStyle = 'rgba(15,19,28,0.94)'; c.fill(); c.restore();
  const g = c.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, 'rgba(255,255,255,0.075)'); g.addColorStop(0.45, 'rgba(255,255,255,0)');
  c.beginPath(); c.roundRect(x, y, w, h, r); c.fillStyle = g; c.fill();
  c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,255,255,0.12)'; c.stroke();
}
function pill(c, x, y, label) {
  c.font = `500 22px ${MONO}`; c.letterSpacing = '3px'; const w = c.measureText(label).width + 74; c.letterSpacing = '0px';
  c.beginPath(); c.roundRect(x, y, w, 52, 26); c.fillStyle = ac(0.15); c.fill(); c.lineWidth = 1.5; c.strokeStyle = ac(0.55); c.stroke();
  c.beginPath(); c.arc(x + 28, y + 26, 6, 0, 7); c.fillStyle = ac(1); c.fill();
  T(c, label, x + 46, y + 34, 22, 500, wh(0.95), { mono: 1, ls: 3 });
}
function tag(c, n, label, a) {
  if (a <= 0) return; c.save(); c.globalAlpha *= a;
  c.fillStyle = ac(1); c.fillRect(72, 196, 28, 3);
  T(c, n, 114, 206, 24, 500, ac(1), { mono: 1, ls: 2 });
  T(c, label, 164, 206, 24, 500, wh(0.62), { mono: 1, ls: 3 }); c.restore();
}
function flare(c, x, y, k, size = 1) {
  if (k <= 0.003) return;
  c.save(); c.globalCompositeOperation = 'lighter';
  const r = 360 * size; let g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(255,255,255,${0.95 * k})`); g.addColorStop(0.07, `rgba(255,255,255,${0.5 * k})`);
  g.addColorStop(0.3, ac(0.2 * k)); g.addColorStop(1, ac(0));
  c.fillStyle = g; c.fillRect(x - r, y - r, 2 * r, 2 * r);
  for (const [sx, sy, a] of [[1800 * size, 9, 0.95], [1150 * size, 28, 0.32]]) {
    c.save(); c.translate(x, y); c.scale(sx / 100, sy / 100);
    g = c.createRadialGradient(0, 0, 0, 0, 0, 100);
    g.addColorStop(0, `rgba(255,255,255,${a * k})`); g.addColorStop(0.25, ac(a * 0.6 * k)); g.addColorStop(1, ac(0));
    c.fillStyle = g; c.fillRect(-100, -100, 200, 200); c.restore();
  }
  for (const [f, rad, a] of [[0.35, 46, 0.11], [0.7, 96, 0.06], [1.25, 30, 0.13], [1.6, 140, 0.05]]) {
    const gx = x + (W / 2 - x) * f * 2, gy = y + (H / 2 - y) * f * 2;
    g = c.createRadialGradient(gx, gy, 0, gx, gy, rad);
    g.addColorStop(0, ac(0)); g.addColorStop(0.72, ac(a * k)); g.addColorStop(1, ac(0));
    c.fillStyle = g; c.fillRect(gx - rad, gy - rad, rad * 2, rad * 2);
  }
  c.restore();
}
function trimPath(c, pts, p) {
  const n = (pts.length - 1) * clamp(p); const k = Math.floor(n), f = n - k;
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i <= k; i++) c.lineTo(pts[i][0], pts[i][1]);
  let end = pts[k];
  if (k < pts.length - 1) { end = [lerp(pts[k][0], pts[k + 1][0], f), lerp(pts[k][1], pts[k + 1][1], f)]; c.lineTo(end[0], end[1]); }
  const prev = pts[Math.max(0, (f > 0.001 || k === 0) ? k : k - 1)];
  return { end, ang: Math.atan2(end[1] - prev[1], end[0] - prev[0]) };
}
function arrowHead(c, x, y, ang, size, col) {
  c.save(); c.translate(x, y); c.rotate(ang); c.beginPath();
  c.moveTo(size * 0.55, 0); c.lineTo(-size * 0.5, -size * 0.52); c.lineTo(-size * 0.5, size * 0.52); c.closePath();
  c.fillStyle = col; c.fill(); c.restore();
}
const quad = (a, b, d, n = 48) => Array.from({ length: n + 1 }, (_, i) => { const u = i / n, v = 1 - u; return [v * v * a[0] + 2 * u * v * b[0] + u * u * d[0], v * v * a[1] + 2 * u * v * b[1] + u * u * d[1]]; });

/* ---------- background ---------- */
function bg(c, t) {
  c.fillStyle = '#06080d'; c.fillRect(0, 0, W, H);
  const g1x = 250 + Math.sin(t * 0.21) * 140, g1y = 420 + Math.cos(t * 0.17) * 120;
  let g = c.createRadialGradient(g1x, g1y, 0, g1x, g1y, 900); g.addColorStop(0, ac(0.17)); g.addColorStop(1, ac(0));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const g2x = 880 + Math.cos(t * 0.19) * 120, g2y = 1560 + Math.sin(t * 0.23) * 140;
  g = c.createRadialGradient(g2x, g2y, 0, g2x, g2y, 820); g.addColorStop(0, ac(0.11)); g.addColorStop(1, ac(0));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(255,255,255,0.055)';
  const off = (t * 7) % 60;
  for (let y = -60 + off; y < H; y += 60) for (let x = 30; x < W; x += 60) c.fillRect(x, y, 2.4, 2.4);
}

/* ---------- scene 0: wordmark, flare, riser card ---------- */
function sIntro(c, lt) {
  const rise = tw(lt, 1.5, 2.0);
  const gy = lerp(940, 620, rise);
  const fp = tw(lt, 0.1, 1.5), fX = lerp(-260, W + 260, fp);
  c.save(); c.beginPath(); c.rect(0, 0, Math.max(0, fX), H); c.clip();
  const ls = lerp(64, 8, tw(lt, 0.1, 1.7));
  T(c, 'SMGP', W / 2 + ls / 2, gy, 236, 800, wh(1), { align: 'center', ls });
  c.restore();
  const l = tw(lt, 0.9, 1.4); c.fillStyle = ac(1); c.fillRect(W / 2 - 170 * l, gy + 62, 340 * l, 4);
  const a = tw(lt, 1.0, 1.5);
  if (a > 0) { c.save(); c.globalAlpha = a; T(c, 'MOTION SYSTEM  /  SAMPLE REEL', W / 2 + 3, gy + 132 + (1 - a) * 16, 26, 500, wh(0.6), { mono: 1, align: 'center', ls: 6 }); c.restore(); }
  flare(c, fX, gy - 84, Math.pow(Math.sin(Math.PI * fp), 0.8), 1);

  const cy = lerp(H + 60, 960, rise), x = 72, w = 936, h = 520;
  if (rise > 0) {
    card(c, x, cy, w, h);
    const st = i => tw(lt, 1.9 + i * 0.1, 2.3 + i * 0.1);
    c.save(); c.globalAlpha = st(0); pill(c, x + 56, cy + 56, 'NOW LIVE'); c.restore();
    c.save(); c.globalAlpha = st(1); T(c, 'Real-time reporting', x + 56, cy + 212 + (1 - st(1)) * 18, 78, 700, wh(1), { ls: -2 }); c.restore();
    c.save(); c.globalAlpha = st(2);
    T(c, 'Every number on screen updates', x + 56, cy + 284, 37, 400, wh(0.62));
    T(c, 'the moment it changes.', x + 56, cy + 336, 37, 400, wh(0.62)); c.restore();
    const p = tw(lt, 2.2, 3.4);
    c.save(); c.globalAlpha = st(3);
    T(c, 'SYNC', x + 56, cy + 420, 22, 500, wh(0.5), { mono: 1, ls: 4 });
    T(c, String(Math.round(p * 100)).padStart(3, ' ') + '%', x + w - 56, cy + 420, 22, 500, wh(0.9), { mono: 1, align: 'right' });
    c.beginPath(); c.roundRect(x + 56, cy + 446, w - 112, 8, 4); c.fillStyle = wh(0.1); c.fill();
    c.beginPath(); c.roundRect(x + 56, cy + 446, Math.max(8, (w - 112) * p), 8, 4); c.fillStyle = ac(1); c.fill();
    c.restore();
  }
  tag(c, '01', 'RISER CARD', tw(lt, 2.0, 2.4));
}

/* ---------- scene 1: screen recording, macro zoom highlight, callout + arrow ---------- */
const WX = 60, WY = 330, WW = 960, WHH = 1260, TX = WX + 70, LH = 62, PY = 712;
const PARA = 'Every dashboard now updates in real time, so your whole team sees the same numbers the moment they change.';
const PARA2 = 'Shared views keep everyone on one version of the numbers. Pin a view once and it stays in sync on every device.';
let wrapCache = null;
function wrap(c, text, font, maxW) {
  c.font = font; c.letterSpacing = '0px'; const out = []; let line = '';
  for (const w of text.split(' ')) { const tryL = line ? line + ' ' + w : w; if (c.measureText(tryL).width > maxW && line) { out.push(line); line = w; } else line = tryL; }
  if (line) out.push(line); return out.map(s => ({ s, w: c.measureText(s).width }));
}
function layout(c) {
  if (wrapCache) return wrapCache;
  const f = `400 40px ${SANS}`;
  const a = wrap(c, PARA, f, 820), b = wrap(c, PARA2, f, 820);
  wrapCache = { a, b, p2y: PY + a.length * LH + 46 }; return wrapCache;
}
function curPos(lt, L) {
  const P0 = [TX, PY - 14], last = L.a.length - 1;
  const P2 = [TX + L.a[last].w, PY - 14 + last * LH], P1 = [TX + L.a[0].w + 30, PY - 14];
  const S0 = [850, 1430];
  if (lt < 2.0) { const p = tw(lt, 0.5, 1.8); return [lerp(S0[0], P0[0], p), lerp(S0[1], P0[1], p)]; }
  const u = tw(lt, 2.0, 4.5), v = 1 - u;
  const x = v * v * P0[0] + 2 * u * v * P1[0] + u * u * P2[0], y = v * v * P0[1] + 2 * u * v * P1[1] + u * u * P2[1];
  const o = tw(lt, 5.4, 6.6); return [x + 150 * o, y + 640 * o];
}
function drawPara(c, L, sel, glow) {
  if (sel) {
    const li = clamp(Math.floor((sel[1] - (PY - 44)) / LH), 0, L.a.length - 1);
    c.fillStyle = ac(0.5 + 0.3 * glow);
    if (glow > 0) { c.save(); c.shadowColor = ac(0.9); c.shadowBlur = 40 * glow * S; }
    for (let i = 0; i <= li; i++) {
      const w = i < li ? L.a[i].w : clamp(sel[0] - TX, 0, L.a[i].w);
      if (w > 0.5) { c.beginPath(); c.roundRect(TX - 5, PY - 45 + i * LH, w + 10, 58, 5); c.fill(); }
    }
    if (glow > 0) c.restore();
  }
  L.a.forEach((ln, i) => T(c, ln.s, TX, PY + i * LH, 40, 400, wh(0.94)));
}
function drawCursor(c, x, y, ibeam, down) {
  c.save(); c.translate(x, y); c.shadowColor = 'rgba(0,0,0,0.6)'; c.shadowBlur = 10 * S; c.shadowOffsetY = 3 * S;
  if (ibeam) {
    c.lineCap = 'round'; c.strokeStyle = 'rgba(6,8,13,0.9)'; c.lineWidth = 7;
    const p = () => { c.beginPath(); c.moveTo(0, -22); c.lineTo(0, 22); c.moveTo(-7, -24); c.lineTo(-2, -22); c.moveTo(7, -24); c.lineTo(2, -22); c.moveTo(-7, 24); c.lineTo(-2, 22); c.moveTo(7, 24); c.lineTo(2, 22); };
    p(); c.stroke(); c.shadowColor = 'transparent'; c.strokeStyle = '#fff'; c.lineWidth = 3; p(); c.stroke();
  } else {
    const k = down ? 1.18 : 1.3; c.scale(k, k); c.beginPath();
    c.moveTo(0, 0); c.lineTo(0, 34); c.lineTo(8, 27); c.lineTo(14, 40); c.lineTo(19.5, 37.5); c.lineTo(13.5, 25); c.lineTo(24, 25); c.closePath();
    c.fillStyle = '#0a0c11'; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = 2.6; c.lineJoin = 'round'; c.strokeStyle = '#fff'; c.stroke();
  }
  c.restore();
}
function sScreen(c, lt) {
  const L = layout(c), Z = P.zoom;
  const a = tw(lt, 1.0, 2.0), b = tw(lt, 5.0, 5.14), d = tw(lt, 6.0, 7.0);
  const zoom = lerp(lerp(1, Z, a) * (1 + 0.1 * b), 1, d), k = a * (1 - d);
  const cu = curPos(lt, L), lag = curPos(lt - 0.14, L);
  const camx = lerp(W / 2, lag[0] + 30, k), camy = lerp(H / 2, lag[1] + 16, k);
  fx.dof = Math.max(fx.dof, k * 12 * P.vig); fx.vig = Math.max(fx.vig, 0.35 + k * 0.6 * P.vig);
