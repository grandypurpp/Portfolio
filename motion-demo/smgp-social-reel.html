<title>SMGP Social Reel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@700;800;900&display=swap">
<style>
/* Layout: an edit bay. 9:16 program monitor on the left, transport and tuning rack on the right; stacks on phones. */
@font-face{font-family:MontserratLocal;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:MontserratLocal;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:MontserratLocal;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2) format("woff2")}
:root{
  color-scheme:dark;
  --bg:#0c0b0a; --panel:#151312; --line:#2a2623; --fg:#f1ede8; --muted:#9a9189; --accent:#4f8cff;
  --sans:Inter,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.wrap.render{max-width:none;padding:0;gap:0}
.wrap.render header,.wrap.render .rack{display:none}
.wrap.render .bay{display:block}
.wrap.render canvas#stage{width:1080px;height:1920px;max-width:none;border:0;border-radius:0}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-size:20px;font-weight:700;letter-spacing:-0.01em;margin:0}
header p{margin:0;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.bay{display:grid;grid-template-columns:minmax(0,auto) minmax(0,380px);gap:22px;align-items:start;justify-content:center}
.monitor{min-width:0;display:flex;justify-content:center}
canvas#stage{display:block;width:min(100%,calc((100vh - 130px)*9/16));min-width:min(100%,250px);max-width:100%;aspect-ratio:9/16;height:auto;border-radius:14px;border:1px solid var(--line);background:#0c0b0a;cursor:pointer}
.rack{min-width:0;display:flex;flex-direction:column;gap:16px}
.group{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.group h2{margin:0;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.transport{display:flex;align-items:center;gap:12px}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play{background:var(--accent);border-color:var(--accent);color:#04060a;font-weight:700;min-width:84px}
#time{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12.5px;padding:5px 9px;color:var(--muted)}
.chips button.on{color:var(--fg);border-color:var(--accent)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.row label{font-size:13.5px}
.row output{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px}
.check input{accent-color:var(--accent);width:16px;height:16px;margin:0}
input[type=color]{width:44px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:transparent}
.note{color:var(--muted);font-size:12.5px;margin:0}
@media (max-width:760px){.bay{grid-template-columns:minmax(0,1fr)}canvas#stage{width:min(100%,340px)}}
</style>

<div class="wrap" id="wrap">
  <header>
    <h1>SMGP Social Reel</h1>
    <p>9:16 · 31 s · hard cuts · sample script</p>
  </header>
  <div class="bay">
    <div class="monitor"><canvas id="stage" width="720" height="1280" aria-label="Reel preview"></canvas></div>
    <div class="rack">
      <div class="group">
        <h2>Transport</h2>
        <div class="transport">
          <button id="play" type="button">Play</button>
          <button id="restart" type="button">Restart</button>
          <span id="time">00.00 / 31.00</span>
        </div>
        <input id="scrub" type="range" min="0" max="31" step="0.01" value="1" aria-label="Timeline position">
        <div class="chips" id="chips"></div>
      </div>
      <div class="group">
        <h2>Look</h2>
        <div class="row"><label for="accent">Accent color</label><input id="accent" type="color" value="#4f8cff"></div>
        <div class="row"><label for="hsize">Headline size</label><output id="hsizeOut">56 px</output>
          <input id="hsize" type="range" min="44" max="72" step="1" value="56"></div>
        <div class="row"><label for="csize">Caption size</label><output id="csizeOut">46 px</output>
          <input id="csize" type="range" min="36" max="64" step="1" value="46"></div>
        <div class="row"><label for="punch">Punch-in on cuts</label><output id="punchOut">10%</output>
          <input id="punch" type="range" min="0" max="25" step="1" value="10"></div>
        <div class="row"><label for="infl">Ease influence inside cards</label><output id="inflOut">33%</output>
          <input id="infl" type="range" min="10" max="90" step="1" value="33"></div>
        <label class="check"><input id="guides" type="checkbox"> Show Instagram safe zones</label>
      </div>
      <div class="group">
        <h2>Sound</h2>
        <div class="row"><label for="sfx">Sound effects</label><output id="sfxOut">90%</output>
          <input id="sfx" type="range" min="0" max="100" step="1" value="90"></div>
        <div class="row"><label for="bed">Music bed</label><output id="bedOut">45%</output>
          <input id="bed" type="range" min="0" max="100" step="1" value="45"></div>
        <p class="note">A pop lands on every cut and a tick on every move inside a card. Sound starts when you press Play.</p>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 1080, H = 1920, DUR = 31;
const RENDER = /[?&]render=1/.test(location.search);
const S = RENDER ? 1 : 2 / 3;
const SANS = 'Inter, "Helvetica Neue", Arial, sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
const HEAD = 'Montserrat, MontserratLocal, Inter, Arial, sans-serif';
const P = { accent: '#4f8cff', infl: 1 / 3, hsize: 56, csize: 46, punch: 0.10, guides: false, sfx: 0.9, bed: 0.45 };
let AR = [79, 140, 255];

const stage = document.getElementById('stage');
if (RENDER) document.getElementById('wrap').classList.add('render');
stage.width = Math.round(W * S); stage.height = Math.round(H * S);
const m = stage.getContext('2d');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
function bezY(x1, y1, x2, y2, x) {
  if (x <= 0) return 0; if (x >= 1) return 1;
  let lo = 0, hi = 1, u = x;
  for (let i = 0; i < 22; i++) { u = (lo + hi) / 2; const v = 1 - u; const bx = 3 * u * v * v * x1 + 3 * u * u * v * x2 + u * u * u; if (bx < x) lo = u; else hi = u; }
  const v = 1 - u; return 3 * u * v * v * y1 + 3 * u * u * v * y2 + u * u * u;

const ee = p => bezY(P.infl, 0, 1 - P.infl, 1, p);   // After Effects Easy Ease
const tw = (t, a, b) => ee(clamp((t - a) / (b - a)));

function T(c, s, x, y, size, wt, col, o = {}) {
  c.font = `${wt} ${size}px ${o.f || SANS}`; c.fillStyle = col; c.textAlign = o.align || 'left'; c.textBaseline = 'alphabetic';
  c.letterSpacing = (o.ls || 0) + 'px'; c.fillText(s, x, y); c.letterSpacing = '0px';

/* ---------- script: every overlay change is a hard cut, as in the reference ---------- */
const CUTS = [2.9, 5.6, 7.8, 8.9, 11.5, 12.8, 14.2, 18.6, 21.5, 22.4, 27.2];
const HEADS = [
  [0, 2.9, ['Your vibe-coded app', 'looks like AI SLOP']],
  [5.6, 7.8, ['3 fixes that make it', 'look DESIGNED']],
  [11.5, 12.8, ['Color is NOT decoration']],
  [18.6, 21.5, ['Motion needs', 'ONE curve']],
  [27.2, 31, ['Comment "BUILD" for', 'the checklist']]
];
const CAPS = [[0, 'Your app works'], [0.7, 'but it looks'], [1.5, 'like every other'], [2.1, 'AI-built app'], [2.9, 'Same fonts'], [3.5, 'same purple gradient'], [4.2, 'same rounded cards'], [4.9, 'It screams generic'],
  [5.6, 'These three fixes'], [6.4, 'take ten minutes'], [7.2, 'Fix one is type'], [8.3, 'Pick one typeface'], [8.9, 'one size scale'], [9.9, 'and stick to it'], [10.7, 'everywhere'],
  [11.5, 'Fix two is color'], [12.2, 'Stop decorating'], [12.8, 'One accent'], [13.5, 'that’s it'], [14.2, 'Neutrals do the work'], [15.5, 'the accent'], [16.0, 'points at one thing'], [16.9, 'the button'], [17.5, 'you want tapped'],
  [18.6, 'Fix three is motion'], [19.4, 'Bouncy springs'], [20.1, 'look like a template'], [20.8, 'Use one ease'], [21.5, 'Easy Ease'], [22.4, 'the After Effects default'], [23.4, 'on everything'], [24.2, 'cards, charts'], [25.0, 'page transitions'], [26.0, 'and it reads'], [26.6, 'as one product'],
  [27.2, 'Comment BUILD'], [28.5, 'and I’ll send you'], [29.3, 'the full checklist'], [30.2, 'directly']];

/* ---------- A-roll placeholder (replace with the talking-head clip) ---------- */
const BOK = (() => { const R = rng(5); return Array.from({ length: 9 }, () => ({ x: R() * W, y: R() * 900, r: 120 + R() * 220, a: 0.05 + R() * 0.07, ph: R() * 7 })); })();
function aroll(c, t) {
  const seg = CUTS.filter(x => t >= x).length, z = 1 + (seg % 2 ? P.punch : 0);
  const sx = Math.sin(t * 1.3) * 5 + Math.sin(t * 2.9) * 2, sy = Math.cos(t * 1.1) * 4;
  c.save(); c.translate(W / 2 + sx, 980 + sy); c.scale(z, z); c.translate(-W / 2, -980);
  let g = c.createLinearGradient(0, -200, 0, H + 200); g.addColorStop(0, '#3a2a1e'); g.addColorStop(0.5, '#241a14'); g.addColorStop(1, '#100c0a');
  c.fillStyle = g; c.fillRect(-200, -200, W + 400, H + 400);
  for (const b of BOK) { const x = b.x + Math.sin(t * 0.3 + b.ph) * 20; g = c.createRadialGradient(x, b.y, 0, x, b.y, b.r); g.addColorStop(0, `rgba(255,214,170,${b.a})`); g.addColorStop(1, 'rgba(255,214,170,0)'); c.fillStyle = g; c.fillRect(x - b.r, b.y - b.r, b.r * 2, b.r * 2); }
  const bob = Math.sin(t * 2.2) * 6;
  g = c.createLinearGradient(0, 700, 0, 1920); g.addColorStop(0, '#565b66'); g.addColorStop(1, '#2b2e35'); c.fillStyle = g;
  c.beginPath(); c.moveTo(60, 2000); c.bezierCurveTo(70, 1500, 250, 1330, 440, 1290 + bob); c.lineTo(640, 1290 + bob); c.bezierCurveTo(830, 1330, 1010, 1500, 1020, 2000); c.closePath(); c.fill();
  c.fillStyle = '#4b4f59'; c.fillRect(478, 1150 + bob, 124, 170);
  c.beginPath(); c.ellipse(540, 960 + bob, 168, 210, 0, 0, 7); c.fillStyle = '#5f646f'; c.fill();
  c.restore();
  T(c, 'A-ROLL PLACEHOLDER', W / 2 + 3, 1560, 24, 500, 'rgba(255,255,255,0.4)', { f: MONO, align: 'center', ls: 6 });
  T(c, 'Lucas’s talking-head clip goes here', W / 2, 1600, 24, 400, 'rgba(255,255,255,0.32)', { align: 'center' });
}

/* ---------- headline pill + captions ---------- */
function headline(c, lines, lt) {
  const fs = P.hsize, lh = fs * 1.3, pop = lerp(0.93, 1, clamp(lt / 0.07)), cy = 470;
  c.save(); c.translate(W / 2, cy); c.scale(pop, pop); c.translate(-W / 2, -cy);
  c.font = `800 ${fs}px ${HEAD}`; c.letterSpacing = '-0.5px';
  const ws = lines.map(s => c.measureText(s).width), y0 = cy - (lines.length * lh) / 2;
  c.fillStyle = '#fff'; c.shadowColor = 'rgba(0,0,0,0.25)'; c.shadowBlur = 18 * S; c.shadowOffsetY = 4 * S;
  lines.forEach((s, i) => { c.beginPath(); c.roundRect(W / 2 - ws[i] / 2 - fs * 0.42, y0 + i * lh - 3, ws[i] + fs * 0.84, lh + 6, fs * 0.3); c.fill(); });
  c.shadowColor = 'transparent'; c.fillStyle = '#0b0b0b'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  lines.forEach((s, i) => c.fillText(s, W / 2, y0 + i * lh + lh * 0.5 + fs * 0.35));
  c.letterSpacing = '0px'; c.restore();
}
function caption(c, s) {
  c.save(); c.shadowColor = 'rgba(0,0,0,0.75)'; c.shadowBlur = 14 * S; c.shadowOffsetY = 2 * S;
  T(c, s, W / 2, 1356, P.csize, 600, '#fff', { align: 'center', ls: -0.5 });
  T(c, s, W / 2, 1356, P.csize, 600, '#fff', { align: 'center', ls: -0.5 }); c.restore();
}

/* ---------- B-roll cards: 908 x 508 window above the head ---------- */
const CX = 86, CY = 232, CW = 908, CH = 508;
function titleCard(c, lt, bgc, fg, num, word, numCol) {
  c.fillStyle = bgc; c.fillRect(0, 0, CW, CH);
  c.strokeStyle = fg; c.globalAlpha = 0.25; c.lineWidth = 2; c.strokeRect(22, 22, CW - 44, CH - 44); c.globalAlpha = 1;
  T(c, num, 48, 82, 30, 500, numCol || fg, { f: MONO, ls: 3 });
  const s = lerp(1.14, 1, tw(lt, 0, 0.25)); c.save(); c.translate(CW / 2, CH / 2 + 20); c.scale(s, s);
  T(c, word, 0, 56, 168, 900, fg, { f: HEAD, align: 'center', ls: -5 }); c.restore();
}
const SPEED = (() => { const R = rng(21); return Array.from({ length: 110 }, () => ({ a: R() * 6.2832, r0: 30 + R() * 130, len: 90 + R() * 420, w: 1 + R() * 3.2, sp: 0.6 + R() * 0.9, wh: R() < 0.3 })); })();
function scramble(str, lt, t0, seed) {
  const G = '#%&0123456789ABXZ/'; let out = '';
  for (let i = 0; i < str.length; i++) { if (str[i] === ' ' || lt >= t0 + 0.14 + i * 0.03) out += str[i]; else { const k = Math.floor(lt * 30) * 31 + i * 17 + seed; out += G[((k * 2654435761) >>> 0) % G.length]; } }
  return out;
}
// Kinetic type: HUD ring and scramble text, white flash, then a speed-line burst with an RGB-split word slam.
function cKinetic(c, lt) {
  c.fillStyle = '#07090c'; c.fillRect(0, 0, CW, CH);
  c.strokeStyle = ac(0.1); c.lineWidth = 1; c.beginPath();
  for (let x = 8; x < CW; x += 46) { c.moveTo(x, 0); c.lineTo(x, CH); } for (let y = 1; y < CH; y += 46) { c.moveTo(0, y); c.lineTo(CW, y); } c.stroke();
  const cx = CW / 2, cy = CH / 2 + 14;
  if (lt < 1.95) {
    c.strokeStyle = ac(0.3); c.lineWidth = 2; c.beginPath(); c.arc(cx, cy, 196, 0, 7); c.stroke();
    c.setLineDash([14, 10]); c.lineDashOffset = -lt * 70; c.beginPath(); c.arc(cx, cy, 214, 0, 7); c.stroke(); c.setLineDash([]);
    c.strokeStyle = ac(1); c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.arc(cx, cy, 178, -Math.PI / 2, -Math.PI / 2 + 6.2832 * clamp(lt / 1.9)); c.stroke(); c.lineCap = 'butt';
    const ph = lt < 0.6 ? 0 : lt < 1.3 ? 1 : 2, t0 = [0, 0.6, 1.3][ph], kick = 1 + 0.08 * (1 - tw(lt, t0, t0 + 0.18));
    T(c, 'EVERY AI APP', cx + 3, 58, 26, 800, ac(1), { f: HEAD, align: 'center', ls: 6 });
    c.save(); c.translate(cx, cy); c.scale(kick, kick); c.shadowColor = ac(0.95); c.shadowBlur = 26 * S;
    c.fillStyle = 'rgba(7,9,12,0.86)'; c.fillRect(-300, -52, 600, 104);
    T(c, scramble(['SAME FONTS', 'SAME GRADIENT', 'SAME CARDS'][ph], lt, t0, ph * 7), 0, 24, 66, 800, '#fff', { f: MONO, align: 'center', ls: -1 }); c.restore();
    T(c, (ph + 1) + ' / 3', cx, CH - 30, 22, 500, ac(0.8), { f: MONO, align: 'center', ls: 3 });
    const fl = clamp((lt - 1.86) / 0.09); if (fl > 0) { c.fillStyle = `rgba(255,255,255,${fl})`; c.fillRect(0, 0, CW, CH); }
  } else {
    const k = lt - 1.95;
    c.save(); c.globalCompositeOperation = 'lighter';
    let g = c.createRadialGradient(cx, cy, 0, cx, cy, 420); g.addColorStop(0, ac(0.55)); g.addColorStop(1, ac(0)); c.fillStyle = g; c.fillRect(0, 0, CW, CH);
    for (const l of SPEED) { const p = clamp(k * l.sp * 1.5 + 0.2), r0 = l.r0 + p * 240 + k * 60 * l.sp, r1 = r0 + l.len * p;
      c.strokeStyle = l.wh ? 'rgba(255,255,255,0.7)' : ac(0.85); c.lineWidth = l.w; c.beginPath(); c.moveTo(cx + Math.cos(l.a) * r0, cy + Math.sin(l.a) * r0); c.lineTo(cx + Math.cos(l.a) * r1, cy + Math.sin(l.a) * r1); c.stroke(); }
    c.restore();
    const sc = lerp(1.7, 1, tw(lt, 1.95, 2.2)), sp = 16 * (1 - tw(lt, 1.95, 2.45));
    c.save(); c.translate(cx, cy); c.scale(sc, sc); c.transform(1, 0, -0.12, 1, 0, 0);
    if (sp > 0.4) { c.globalCompositeOperation = 'lighter'; T(c, 'GENERIC', -sp, 52, 150, 900, 'rgba(255,40,60,0.9)', { f: HEAD, align: 'center', ls: -5 }); T(c, 'GENERIC', sp, 52, 150, 900, 'rgba(40,220,255,0.9)', { f: HEAD, align: 'center', ls: -5 }); c.globalCompositeOperation = 'source-over'; }
    c.shadowColor = ac(1); c.shadowBlur = 40 * S; T(c, 'GENERIC', 0, 52, 150, 900, '#fff', { f: HEAD, align: 'center', ls: -5 }); c.restore();
    const fl = 1 - clamp(k / 0.22); if (fl > 0) { c.fillStyle = `rgba(255,255,255,${fl})`; c.fillRect(0, 0, CW, CH); }
  }
}
function cType(c, lt) {
  c.fillStyle = '#fff'; c.fillRect(0, 0, CW, CH);
  const p = tw(lt, 0.6, 1.3);
  const rows = [['Dashboard', 74, 46, 62, 800], ['Weekly report', 22, 96, 34, 600], ['Updated two minutes ago', 34, 20, 22, 400]];
  let y = 120;
  rows.forEach(([s, a, xa, b, wt], i) => { const fs = lerp(a, b, p); T(c, s, lerp(xa, 56, p), y, fs, wt, i === 2 ? '#6b6b73' : '#0b0b0b', { f: i === 0 ? HEAD : SANS, ls: -0.5 }); y += lerp([110, 60, 0][i], [74, 50, 0][i], p); });
  for (let i = 0; i < 3; i++) { c.beginPath(); c.roundRect(56, 300 + i * 40, [520, 470, 300][i], 16, 8); c.fillStyle = '#e7e7ec'; c.fill(); }
  c.fillStyle = '#e7e7ec'; c.fillRect(660, 60, 2, 388);
  [62, 34, 22, 16].forEach((v, i) => { const on = tw(lt, 1.3 + i * 0.25, 1.5 + i * 0.25);
    c.fillStyle = on > 0.5 ? ac(1) : '#c9c9d1'; c.fillRect(700, 108 + i * 92, 40 + v * 1.4 * Math.max(0.25, on), 8);
    T(c, String(v), 700, 96 + i * 92, 24, 500, on > 0.5 ? '#0b0b0b' : '#9a9aa3', { f: MONO }); });
}
function cColor(c, lt) {
  c.fillStyle = '#f3efe6'; c.fillRect(0, 0, CW, CH);
  const from = [[255, 77, 77], [255, 170, 51], [255, 221, 51], [61, 214, 140], [155, 92, 255], AR], to = [[24, 24, 27], [63, 63, 70], [113, 113, 122], [212, 212, 216], [244, 244, 245], AR];
  const p = tw(lt, 1.0, 1.8);
  for (let i = 0; i < 6; i++) {
    const a = tw(lt, i * 0.09, 0.2 + i * 0.09); if (a <= 0) continue;
    const col = from[i].map((v, k) => Math.round(lerp(v, to[i][k], p))), s = lerp(0.6, 1, a) * (i === 5 ? 1 + 0.12 * p : 1);
    c.save(); c.translate(102 + i * 141, 130); c.scale(s, s); c.beginPath(); c.roundRect(-58, -58, 116, 116, 22); c.fillStyle = `rgb(${col})`; c.fill();
    c.lineWidth = 2; c.strokeStyle = 'rgba(0,0,0,0.08)'; c.stroke(); c.restore();
  }
  const b = tw(lt, 2.2, 2.6);
  if (b > 0) {
    c.save(); c.globalAlpha = b; c.translate(0, (1 - b) * 30);
