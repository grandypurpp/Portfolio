.call{position:absolute;font-family:IT;color:#F6EFE6;white-space:nowrap}
.call b{display:block;font-weight:400;letter-spacing:.01em}
.call i{display:block;font-style:normal;font-weight:500;letter-spacing:.24em;text-transform:uppercase;opacity:.6;margin-top:6px}

#black{background:#000}

    <div class="bgimg" style="background-image:url(${img(s.img)});transform:scale(${1.12 - .04*p})"></div>
    <div class="panel" style="left:${px}px;top:${py + drift}px;width:${pw}px;height:${ph}px;transform:scale(${1 + .02*(1-alpha)})">
      <img src="${img(s.img)}" style="transform:scale(${push});object-position:${s.pan[0]*100}% ${s.pan[1]*100}%"></div></div>`;
}
function textHTML(x, t) {
  const pin = seg(t, x.a, x.a + .9, 'oexp'), pout = seg(t, x.b - .5, x.b, 'icub');
  if (t < x.a || t > x.b) return '';
  const op = pin * (1 - pout), y = 26 * (1 - pin) - 12 * pout, bl = 12 * (1 - pin) + 8 * pout, ls = .12 * (1 - pin);
  const onPhoto = x.side === 'photo' && !VERT;
  const left = LX, top = onPhoto ? 430 : BY;
  let h = `<div class="t" style="left:${left}px;top:${top}px;opacity:${op};transform:translateY(${y}px);filter:blur(${bl}px)">`;
  if (x.lab) h += `<div class="lab" style="font-size:${19*U}px;margin-bottom:${22*U}px;letter-spacing:${.32 + ls}em">${x.lab}</div>`;
  h += `<div class="hd" style="font-size:${(VERT ? 74 : 78)}px;letter-spacing:${-.015 + ls}em">${x.hd}</div>`;
  if (x.sub) h += `<div class="sub" style="font-size:${24*U}px;margin-top:${22*U}px">${x.sub}</div>`;
  return h + `</div>`;
}
function callHTML(c, t) {
  if (t < c.a || t > c.b) return ['', ''];
  const pin = seg(t, c.a, c.a + .8, 'oexp'), pout = seg(t, c.b - .5, c.b, 'icub'), op = pin * (1 - pout);
  const [ax, ay] = project(worldOf(c.o(), c.p)); const s = VERT ? .5 : 1;
  const lx = ax + c.dx * s, ly = ay + c.dy * s, k = pin;
  const ex = ax + (lx - ax) * k, ey = ay + (ly - ay) * k;
  const right = c.dx > 0;
  const line = `<circle cx="${ax}" cy="${ay}" r="${5*op}" fill="#F6EFE6" opacity="${op}"/><circle cx="${ax}" cy="${ay}" r="${14*op}" fill="none" stroke="#F6EFE6" stroke-opacity="${.35*op}"/>
    <path d="M${ax},${ay} L${ex},${ey} L${ex + (right ? 40 : -40) * k},${ey}" stroke="#F6EFE6" stroke-opacity="${.7*op}" stroke-width="1.5" fill="none"/>`;
  const tx = right ? `left:${Math.min(lx + 52, W - (VERT ? 330 : 420))}px` : `left:${Math.max(lx - 52, VERT ? 330 : 420)}px;transform:translateX(-100%)`;
  return [line, `<div class="call" style="${tx};top:${ly - 22}px;opacity:${op};filter:blur(${6*(1-pin)}px)"><b style="font-size:${30*U}px">${c.t}</b><i style="font-size:${15*U}px">${c.s}</i></div>`];
}
// end card
function endHTML(t) {
  if (t < 35.2) return '';
  const p1 = seg(t, 35.2, 36.4, 'oexp'), p2 = seg(t, 35.9, 37.1, 'oexp'), p3 = seg(t, 36.6, 37.8, 'oexp');
  const ed = (p, d = 20) => `opacity:${p};transform:translateY(${d*(1-p)}px);filter:blur(${10*(1-p)}px)`;
  const left = LX, top = VERT ? 1380 : 400;
  return `<div style="position:absolute;inset:0;background:linear-gradient(${VERT ? '0deg' : '90deg'},rgba(12,8,5,.82) 0%,rgba(12,8,5,.35) 48%,rgba(12,8,5,0) 70%);opacity:${p1}"></div>
   <div class="t" style="left:${left}px;top:${top}px">
    <div class="lab" style="font-size:${19*U}px;${ed(p1)}">Seven Seas Vans</div>
    <div class="hd" style="font-size:${VERT ? 92 : 96}px;margin-top:${24*U}px;${ed(p2)}">Drop Leaf<br>Wall Table</div>
    <div class="sub" style="font-size:${24*U}px;margin-top:${30*U}px;${ed(p3)}">Stows flat. Deploys in one move.</div>
    <div style="margin-top:${54*U}px;display:flex;align-items:center;gap:22px;${ed(p3)}">
      <img src="img/logo.png" style="width:${92*U}px;height:${92*U}px;border-radius:50%;object-fit:cover;filter:saturate(.9)">
      <div class="lab" style="font-size:${15*U}px;line-height:1.9">Designed &amp; built<br>in San Diego, California</div>
    </div></div>`;
}
// light leaks on the cuts
const LEAKS = [3.85, 15.85, 26.85, 34.9];
function leakCSS(t) {
  let css = '';
  for (const l of LEAKS) { const p = (t - l) / 1.5; if (p < 0 || p > 1) continue;
    const a = Math.sin(p * Math.PI) * .55, x = -20 + 140 * E.io(p);
    css += `radial-gradient(ellipse 55% 75% at ${x}% 40%, rgba(255,150,60,${a}) 0%, rgba(255,110,40,${a*.4}) 40%, rgba(0,0,0,0) 70%),`; }
  return css ? css.slice(0, -1) : 'none';
}
// film grain, seeded per frame
const gctx = grainC.getContext('2d'), gimg = gctx.createImageData(480, 270);
function grainFrame(f) { let s = (f * 7919 + 13) % 2147483647 || 1;
  for (let i = 0; i < gimg.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = (s / 2147483647) * 255; gimg.data[i] = gimg.data[i+1] = gimg.data[i+2] = v; gimg.data[i+3] = 255; }
  gctx.putImageData(gimg, 0, 0); }

function renderFrame(f) {
  const t = f / FPS;
  let html = '', glVisible = false, glAlpha = 0, lines = '';
  for (const s of SHOTS) {
    if (t < s.a || t >= s.b) continue;
    const al = shotAlpha(s, t);
    if (s.k === '3d') { SH3D[s.f](t - s.a); glVisible = true; glAlpha = al; }
    else html += photoHTML(s, t, al);
  }
  canvas.style.visibility = glVisible ? 'visible' : 'hidden';
  if (glVisible) { scene.updateMatrixWorld(true); composer.render(); canvas.style.opacity = 1; }
  // photo shots fade in OVER the 3D; 3D fading in over a photo is done by fading the photo out
  for (const s of SHOTS) if (s.k === '3d' && t >= s.a && t < s.a + s.fin && s.a > 0) {
    const prev = SHOTS[SHOTS.indexOf(s) - 1]; const al = 1 - seg(t, s.a, s.a + s.fin, 'io');
    html = photoHTML(prev, t, al); }
  shotsEl.innerHTML = html;
  let tx = ''; for (const x of TX) tx += textHTML(x, t);
  for (const c of CALLS) { const [l, h] = callHTML(c, t); lines += l; tx += h; }
  tx += endHTML(t);
  textsEl.innerHTML = tx; linesEl.innerHTML = lines;
  leakEl.style.background = leakCSS(t);
  blackEl.style.opacity = Math.max(1 - seg(t, 0, 1.4, 'isine'), seg(t, DUR - 1.3, DUR - .1, 'io'));
  grainFrame(f);
}

const imgs = ['folded_flat', 'open_bedside', 'folded_bed'];
window.__ready = Promise.all([document.fonts.load('300 40px IT'), document.fonts.load('500 40px IT'), document.fonts.load('400 40px IT'),
  ...imgs.map(n => new Promise(r => { const i = new Image(); i.onload = r; i.src = img(n); })),
  new Promise(r => { const i = new Image(); i.onload = r; i.src = 'img/logo.png'; })]).then(() => true);
window.__frames = Math.round(DUR * FPS); window.__size = [W, H];
window.renderFrame = f => { renderFrame(f); return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); };
</script>
