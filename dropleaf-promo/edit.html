const ease = {
  lin: t => t, io: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2,

// ---------- three.js scene ----------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false);

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, 1080/1920, 1, 1000);
scene.add(new THREE.HemisphereLight(0xffffff, 0xeadfd6, 1.6));
const sun = new THREE.DirectionalLight(0xfff6ec, 2.4);
sun.position.set(-30, 45, 60); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 6; sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 200 });
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(40, 10, 40); scene.add(fill);

function texCanvas(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
// seeded random so every render is identical
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const woodTex = texCanvas(1024, 1024, (g, w, h) => {
  g.fillStyle = '#EBD5AA'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 140; i++) {
    const y0 = rnd() * h, amp = 6 + rnd() * 18, fr = 0.002 + rnd() * 0.004, ph = rnd() * 6;
    g.strokeStyle = `rgba(${170 + rnd()*30|0},${120 + rnd()*30|0},${60 + rnd()*20|0},${0.05 + rnd()*0.10})`;

    for (let x = 0; x <= w; x += 8) g.lineTo(x, y0 + Math.sin(x * fr + ph) * amp + Math.sin(x * fr * 3.1) * amp * .3);
    g.stroke();
  }
});
const edgeTex = texCanvas(64, 64, (g, w, h) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#D6B27A' : '#EED9AE'; g.fillRect(0, i*h/8, w, h/8); } });
edgeTex.wrapS = edgeTex.wrapT = THREE.RepeatWrapping;
const wood = new THREE.MeshStandardMaterial({ map: woodTex, roughness: .72, metalness: 0 });
const ply  = new THREE.MeshStandardMaterial({ map: edgeTex, roughness: .8 });
const steel = new THREE.MeshStandardMaterial({ color: 0x1d1b1e, roughness: .45, metalness: .6 });

// wall: soft panel that fades into the canvas color, with a faint grid
const wallTex = texCanvas(1024, 1024, (g, w, h) => {
  const grd = g.createRadialGradient(w/2, h/2, w*.12, w/2, h/2, w*.5);
  grd.addColorStop(0, 'rgba(236,230,239,1)'); grd.addColorStop(1, 'rgba(253,251,254,0)');

});
const wall = new THREE.Mesh(new THREE.PlaneGeometry(110, 110), new THREE.MeshStandardMaterial({ map: wallTex, transparent: true, roughness: 1 }));
wall.position.set(0, -6, 0); wall.receiveShadow = true; scene.add(wall);
const shadowCatch = new THREE.Mesh(new THREE.PlaneGeometry(110, 110), new THREE.ShadowMaterial({ opacity: .22 }));
shadowCatch.position.set(0, -6, 0.02); shadowCatch.receiveShadow = true; scene.add(shadowCatch);

// dimensions (inches): top 26 x 13, leaves 12 deep x 10 tall with a 7" round

// plywood backer board the unit mounts to (as in the photos)
const backer = new THREE.Mesh(new THREE.BoxGeometry(24, 46, .75), [ply, ply, ply, ply, new THREE.MeshStandardMaterial({ map: woodTex.clone(), color: 0xE2C38E, roughness: .75 }), ply]);

leafGeo.computeBoundingBox();
// fix UVs so the grain maps sensibly on the faces
{ const uv = leafGeo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / 14, uv.getY(i) / 14); }

// motion arcs (thick red tubes drawn on progressively)
function arcTube(fn, n = 64) {

}
const RA = TD + 2.2;

const RL = LH + 2;
const arcLeaf = [1, -1].map(s => arcTube(t => { const a = (90 - 90*t) * Math.PI/180; return new THREE.Vector3(s*(TW/2 + Math.sin(a)*RL), -Math.cos(a)*RL + .5, HZ + LD*.62); }));
function setArc(arc, p) {

  arc.mesh.geometry.setDrawRange(0, Math.floor(arc.total * p / 6) * 6);

  for (const L of leaves) L.piv.rotation.z = L.s * g('leaf') * Math.PI/180;
  topEdge.material.opacity = Math.max(g('edgeTop'), g('lock'));
  for (const L of leaves) L.mesh.children[0].material.opacity = Math.max(g('edgeLeaf'), g('lock'));
  setArc(arcTop, g('arcTop')); for (const a of arcLeaf) setArc(a, g('arcLeaf'));
  const az = g('az') * Math.PI/180, el = g('el') * Math.PI/180, d = g('dist');
  cam.position.set(target.x + d*Math.sin(az)*Math.cos(el), target.y + d*Math.sin(el), target.z + d*Math.cos(az)*Math.cos(el));
  cam.lookAt(target);

  cam.setViewOffset(1080, 1920, 0, -60, 1080, 1920);
  cam.updateMatrixWorld();
}
function project(p) { const v = new THREE.Vector3(...p).project(cam); return [(v.x + 1) / 2 * 1080, (1 - v.y) / 2 * 1920]; }

// ---------- DOM helpers ----------
const dom = document.getElementById('dom'), svg = document.getElementById('lines'), hbv = document.getElementById('hbv');
function wordHTML(wd, f) {
  const s = B(wd.at), big = wd.z >= 180, n = big ? 4 : 3;
  if (f < s) return `<span class="w${wd.sf?' sf':''}" style="font-size:${wd.z}px;visibility:hidden">${wd.w}</span>`;
  const p = ease.pop(clamp((f - s) / n));
  const sc = big ? 1.2 - .2*p : .86 + .14*p, bl = (big ? 10 : 6) * (1 - p);
  return `<span class="w${wd.sf?' sf':''}" style="font-size:${wd.z}px;opacity:${p};transform:translateY(${6*(1-p)}px) scale(${sc});filter:blur(${bl}px);color:${mixHex(PINK, RED, p)}">${wd.w}</span>`;
}
const linesHTML = (lines, f, top) => `<div class="txt" style="top:${top}px">${lines.map(l => `<div class="ln">${l.map(w => wordHTML(w, f)).join('')}</div>`).join('')}</div>`;
const IMG = n => `img/${n}.jpg`;
function cardHTML(img, top, h, f0, f1, f, left = 43, w = 994) {
  const push = 1 + .04 * clamp((f - f0) / (f1 - f0));
  return `<div class="card" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px"><img src="${IMG(img)}" style="transform:scale(${push})"></div>`;
}
function tagHTML() { return `<div class="tag" style="top:${V === 'story' ? 200 : 210}px"><i></i>Drop Leaf · wall table</div>`; }

// collect cues once
for (const sec of EDIT.sections) {
  const st = B(sec.from) + (sec.breath || 0);
  if (sec.swipeIn) cues.push({ f: B(sec.from) - 2, type: 'whoosh' });
  else cues.push({ f: st, type: 'pop' });
  const all = [].concat(sec.lines || [], sec.text ? sec.text.lines : [], ...(sec.steps || []).map(s => s.lines));
  for (const l of all) for (const w of l) if (w.z >= 180) cues.push({ f: B(w.at), type: 'pop' });
  for (const s of sec.steps || []) if (s.at !== sec.from) cues.push({ f: B(s.at), type: 'tick' });
  for (const c of sec.callouts || []) cues.push({ f: B(c.at), type: 'tick' });
  if (sec.track === 'A' || sec.track === 'S') { const L = TRACKS[sec.track];
    cues.push({ f: B(sec.from + L.phi[1][0]), type: 'swoosh' });
    const li = L.leaf.findIndex(k => k[1] === 0); cues.push({ f: B(sec.from + L.leaf[li][0]), type: 'clack' });
    if (sec.track === 'S') { cues.push({ f: B(sec.from + 9.5), type: 'swoosh' }); cues.push({ f: B(sec.from + 11.6), type: 'clack' }); } }
  if (sec.track === 'B') { cues.push({ f: B(sec.from + .4), type: 'swoosh' }); cues.push({ f: B(sec.from + 3.2), type: 'clack' }); }
  if (sec.foot) cues.push({ f: B(sec.foot.at), type: 'tick' });
}

// ---------- render one frame ----------
const secs = EDIT.sections;
function renderFrame(f) {
  const b = f / FPB;
  let i = secs.findIndex(s => f >= B(s.from) && f < B(s.to)); if (i < 0) i = secs.length - 1;
  const sec = secs[i], f0 = B(sec.from), f1 = B(sec.to);
  let html = '', lines = '';
  canvas.style.visibility = 'hidden'; hbv.setAttribute('stdDeviation', '0 0');
  const breath = sec.breath && f < f0 + sec.breath;
  if (!breath) {
    if (sec.kind === 'text') html += linesHTML(sec.lines, f, sec.top);
    if (sec.kind === 'photo') {
      // swipe: incoming card crosses the frame over 6 frames, new shot revealed from frame 4
      const sf = f - f0 + 2;
      const prev = secs[i-1];
      if (sec.swipeIn && sf < 4 && prev && prev.kind === 'photo') html += cardHTML(prev.img, prev.top, prev.h, B(prev.from), B(prev.to), f);
      else html += cardHTML(sec.img, sec.top, sec.h, f0, f1, f);
      if (sec.text && !(sec.swipeIn && sf < 4)) html += linesHTML(sec.text.lines, f, sec.text.top);
      else if (sec.swipeIn && sf < 4 && prev.text) html += linesHTML(prev.text.lines, f, prev.text.top);
      if (sec.swipeIn && sf >= 0 && sf <= 6) {
        const x = 1.1 - 2.2 * (sf / 6), blur = sf === 3 ? 40 : 60;
        hbv.setAttribute('stdDeviation', `${blur} 0`);
        html += `<div class="card" style="top:${sec.top}px;height:${sec.h}px;transform:translateX(${x*1080}px);border:6px solid ${RED};box-sizing:border-box;filter:url(#hb)"><img src="${IMG(sec.img)}"></div>`;
      }
    }
    if (sec.kind === '3d') {
      canvas.style.visibility = 'visible';
      const lb = b - sec.from; pose3D(sec.track, lb); renderer.render(scene, cam);
      let st = null; for (const s of sec.steps) if (b >= s.at) st = s;
      if (st) {
        if (st.n) html += `<div class="txt" style="top:${V==='story'?300:290}px"><span class="chip">${st.n}</span></div>`;
        html += linesHTML(st.lines, f, V === 'story' ? 370 : 360);
      }
      const trk = TRACKS[sec.track];
      if (kf(trk.lock, lb) > .5) html += `<div class="txt" style="top:1370px"><span class="small">✓ locked</span></div>`;
      for (const c of sec.callouts || []) {
        if (b < c.at || (c.end && b >= c.end)) continue;
        const p = ease.pop(clamp((f - B(c.at)) / 4));
        const [ax, ay] = project(c.anchor), lx = ax + c.dx, ly = ay + c.dy;
        lines += `<line x1="${ax}" y1="${ay}" x2="${ax + (lx-ax)*p}" y2="${ay + (ly-ay)*p}" stroke="${RED}" stroke-width="4"/>`;
        html += `<div class="dot" style="left:${ax}px;top:${ay}px;transform:scale(${p})"></div>`;
        const up = c.dy < 0, ty = up ? '-100%' : '0';
        const tx = c.align === 'right' ? `translate(-100%,${ty})` : c.align === 'center' ? `translate(-50%,${ty})` : `translate(-12%,${ty})`;
        html += `<div class="call${c.sf?' sf':''}" style="left:${lx}px;top:${ly + (up ? -8 : 8)}px;transform:${tx};opacity:${p};filter:blur(${6*(1-p)}px);color:${mixHex(PINK, RED, p)}">${c.txt}</div>`;
      }
    }
    if (sec.kind === 'cta') {
      html += linesHTML(sec.lines, f, sec.top);
      const c = sec.card, cs = B(sec.from) + sec.breath + 6;
      if (f >= cs) { const p = ease.pop(clamp((f - cs) / 6));
        html += `<div style="opacity:${p};transform:translateY(${30*(1-p)}px)">${cardHTML(c.img, c.top, c.h, cs, f1, f, (1080 - c.w)/2, c.w)}</div>`; }
      if (b >= sec.foot.at) { const p = ease.pop(clamp((f - B(sec.foot.at)) / 4));
        html += `<div class="txt" style="top:${sec.foot.top}px;opacity:${p}"><span class="small">${sec.foot.txt}</span></div>`; }
    }
    html += tagHTML();
  }
  dom.innerHTML = html; svg.innerHTML = lines;
}

// preload images + fonts, then expose
const imgs = ['stowed', 'deployed', 'detail', 'lowpro', 'small'];
window.__ready = Promise.all([document.fonts.load('900 100px IT'), document.fonts.load('italic 100px IS'),
  ...imgs.map(n => new Promise(r => { const im = new Image(); im.onload = r; im.src = IMG(n); }))]).then(() => true);
window.__frames = B(EDIT.dur);
window.__cues = cues.sort((a, b) => a.f - b.f);
window.__fpb = FPB;
window.renderFrame = f => { renderFrame(f); return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); };
</script>
</body></html>
